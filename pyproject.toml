[project]
name = "diffusion-jev"
version = "0.1.0"
description = "Local structured decisions with OptiQ DiffusionGemma on Apple Silicon"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "mlx-optiq==0.5.12; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
]

[project.scripts]
jev-local = "diffusion_jev.cli:main"

[project.urls]
Repository = "https://github.com/Saik0s/diffusiongemma-jev-macos"
Documentation = "https://github.com/Saik0s/diffusiongemma-jev-macos#readme"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffusion_jev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
mypy_path = ["src", "typings"]
explicit_package_bases = true
